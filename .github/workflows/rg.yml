name: Terraform Azure RG Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read


jobs:

  terraform:

    runs-on: self-hosted

    steps:

    - name: Checkout
      uses: actions/checkout@v5


    - name: Azure Login
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4


    - name: Terraform Init
      run: terraform init


    - name: Terraform Plan
      run: terraform plan


    - name: Terraform Apply
      run: terraform apply -auto-approve
