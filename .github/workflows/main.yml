name: Landing Zone Deployment

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:

  # ==================================================
  # STAGE 1: SECURITY SCAN
  # ==================================================
  security-scan:
    name: Security Scan
    runs-on: self-hosted

    steps:

      # ----------------------------------------------
      # Checkout
      # ----------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ----------------------------------------------
      # Configure Python PATH
      # ----------------------------------------------
      - name: Configure Python PATH
        shell: powershell
        run: |
          $pythonPath = "C:\Users\ylaxa\AppData\Local\Programs\Python\Python313"
          $pythonScripts = "C:\Users\ylaxa\AppData\Local\Programs\Python\Python313\Scripts"

          if (Test-Path $pythonPath) {
            $env:PATH = "$pythonPath;$env:PATH"
          }

          if (Test-Path $pythonScripts) {
            $env:PATH = "$pythonScripts;$env:PATH"
          }

          "PATH=$env:PATH" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8


      # ----------------------------------------------
      # Verify Security Tools
      # ----------------------------------------------
      - name: Verify Security Tools
        shell: powershell
        continue-on-error: true
        run: |

          Write-Host "========== Trivy =========="
          trivy --version

          Write-Host "========== Checkov =========="
          python --version
          checkov --version

          Write-Host "========== TFLint =========="
          tflint --version


      # ----------------------------------------------
      # Trivy
      # ----------------------------------------------
      - name: Trivy Terraform Security Scan
        shell: powershell
        continue-on-error: true
        run: |
          trivy config . `
            --severity HIGH,CRITICAL `
            --exit-code 1


      # ----------------------------------------------
      # Checkov
      # ----------------------------------------------
      - name: Checkov Terraform Security Scan
        shell: powershell
        continue-on-error: true
        run: |
          checkov -d . `
            --framework terraform `
            --quiet


      # ----------------------------------------------
      # TFLint
      # ----------------------------------------------
      - name: TFLint
        shell: powershell
        continue-on-error: true
        run: |
          tflint --recursive


  # ==================================================
  # STAGE 2: TERRAFORM VALIDATE
  # ==================================================
  terraform-validate:
    name: Terraform Validate
    runs-on: self-hosted

    needs:
      - security-scan

    steps:

      # ----------------------------------------------
      # Checkout
      # ----------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ----------------------------------------------
      # Azure Login
      # ----------------------------------------------
      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ----------------------------------------------
      # Verify Azure Login
      # ----------------------------------------------
      - name: Verify Azure Login
        shell: powershell
        run: |
          az account show


      # ----------------------------------------------
      # Terraform Init
      # ----------------------------------------------
      - name: Terraform Init
        shell: powershell
        working-directory: .\ENV(parent_module)\DEV
        run: |
          terraform init -no-color


      # ----------------------------------------------
      # Terraform Validate
      # ----------------------------------------------
      - name: Terraform Validate
        shell: powershell
        working-directory: .\ENV(parent_module)\DEV
        run: |
          terraform validate -no-color


  # ==================================================
  # STAGE 3: TERRAFORM PLAN
  # ==================================================
  terraform-plan:
    name: Terraform Plan
    runs-on: self-hosted

    needs:
      - terraform-validate

    steps:

      # ----------------------------------------------
      # Checkout
      # ----------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ----------------------------------------------
      # Azure Login
      # ----------------------------------------------
      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ----------------------------------------------
      # Terraform Init
      # ----------------------------------------------
      - name: Terraform Init
        shell: powershell
        working-directory: .\ENV(parent_module)\DEV
        run: |
          terraform init -no-color


      # ----------------------------------------------
      # Terraform Plan
      # ----------------------------------------------
      - name: Terraform Plan
        shell: powershell
        working-directory: .\ENV(parent_module)\DEV
        run: |
          terraform plan -no-color


  # ==================================================
  # STAGE 4: TERRAFORM APPLY
  # ==================================================
  terraform-apply:
    name: Terraform Apply
    runs-on: self-hosted

    needs:
      - terraform-plan

    # ----------------------------------------------
    # Manual Approval
    # Configure approval in GitHub Environment
    # ----------------------------------------------
    environment:
      name: DEV

    steps:

      # ----------------------------------------------
      # Checkout
      # ----------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ----------------------------------------------
      # Azure Login
      # ----------------------------------------------
      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ----------------------------------------------
      # Terraform Init
      # ----------------------------------------------
      - name: Terraform Init
        shell: powershell
        working-directory: .\ENV(parent_module)\DEV
        run: |
          terraform init -no-color


      # ----------------------------------------------
      # Terraform Apply
      # ----------------------------------------------
      - name: Terraform Apply
        shell: powershell
        working-directory: .\ENV(parent_module)\DEV
        run: |
          terraform apply -auto-approve -no-color
