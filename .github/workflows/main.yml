name: Azure Connectivity Test (Secret-based Login)

on:
  workflow_dispatch:

jobs:
  azure-connectivity-test:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login using Service Principal
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.0c075194-1758-4a04-b64f-65876a4bedfd }}
          tenant-id: ${{ secrets.b6f32ed5-51d1-4226-96a6-db5b972504ce }}
          subscription-id: ${{ secrets.2cec8319-0121-4912-85d6-b2e4e5d68fbf }}
          client-secret: ${{ secrets.IfP8Q~ZGP0Hjrxm0W2FPUJbNqqIIdt.qGd_sOcvc }}

      - name: Verify Azure Login (Account Info)
        run: az account show

      - name: Verify Subscription Access
        run: az account list --output table

      - name: Check Resource Access (Read Only Test)
        run: az group list --output table
