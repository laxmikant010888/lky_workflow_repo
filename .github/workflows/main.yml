name: Landing Zone Deployment

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform-security-scan:
    runs-on: self-hosted

    steps:

      # --------------------------------------------------
      # 1. Checkout Repository
      # --------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # --------------------------------------------------
      # 2. GitGuardian - Secret Scanning
      # Windows Self-Hosted Runner
      # --------------------------------------------------
      - name: GitGuardian Secret Scan
        shell: powershell
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: |
          ggshield secret scan ci


      # --------------------------------------------------
      # 3. Trivy - Terraform Security Scan
      # Windows Self-Hosted Runner
      # --------------------------------------------------
      - name: Trivy Terraform Security Scan
        shell: powershell
        run: |
          trivy config . --severity HIGH,CRITICAL --exit-code 1


      # --------------------------------------------------
      # 4. Checkov - Terraform Security Scan
      # Windows Self-Hosted Runner
      # --------------------------------------------------
      - name: Checkov Terraform Security Scan
        shell: powershell
        run: |
          checkov -d . --framework terraform --quiet


      # --------------------------------------------------
      # 5. TFLint - Terraform Linting
      # Windows Self-Hosted Runner
      # --------------------------------------------------
      - name: TFLint
        shell: powershell
        run: |
          tflint --recursive


      # --------------------------------------------------
      # 6. Azure Login using OIDC
      # --------------------------------------------------
      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # --------------------------------------------------
      # 7. Terraform Init
      # --------------------------------------------------
      - name: Terraform Init
        shell: powershell
        working-directory: .\ENV(parent_module)\DEV
        run: |
          terraform init -no-color


      # --------------------------------------------------
      # 8. Terraform Validate
      # --------------------------------------------------
      - name: Terraform Validate
        shell: powershell
        working-directory: .\ENV(parent_module)\DEV
        run: |
          terraform validate -no-color


      # --------------------------------------------------
      # 9. Terraform Plan
      # --------------------------------------------------
      - name: Terraform Plan
        shell: powershell
        working-directory: .\ENV(parent_module)\DEV
        run: |
          terraform plan -no-color


      # --------------------------------------------------
      # 10. Terraform Apply
      # --------------------------------------------------
      - name: Terraform Apply
        shell: powershell
        working-directory: .\ENV(parent_module)\DEV
        run: |
          terraform apply -auto-approve -no-color
