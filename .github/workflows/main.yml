name: Landing Zone Deployment

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform-security-scan:
    runs-on: self-hosted

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # --------------------------------------------------
      # 2. GitGuardian - Secret Scanning
      # --------------------------------------------------
      - name: GitGuardian Secret Scan
        uses: GitGuardian/ggshield/actions/secret@v1.45.0
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}


      # --------------------------------------------------
      # 3. Trivy - Terraform Security Scan
      # --------------------------------------------------
      - name: Trivy Terraform Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1


      # --------------------------------------------------
      # 4. Checkov - IaC Security Scan
      # --------------------------------------------------
      - name: Checkov Terraform Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          quiet: false
          soft_fail: false


      # --------------------------------------------------
      # 5. TFLint - Terraform Linting
      # --------------------------------------------------
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest

      - name: TFLint
        run: tflint --recursive


      # --------------------------------------------------
      # 6. Azure Login
      # --------------------------------------------------
      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # --------------------------------------------------
      # 7. Terraform Init
      # --------------------------------------------------
      - name: Terraform Init
        run: terraform init -no-color


      # --------------------------------------------------
      # 8. Terraform Validate
      # --------------------------------------------------
      - name: Terraform Validate
        run: terraform validate -no-color


      # --------------------------------------------------
      # 9. Terraform Plan
      # --------------------------------------------------
      - name: Terraform Plan
        run: terraform plan -no-color


      # --------------------------------------------------
      # 10. Terraform Apply
      # --------------------------------------------------
      - name: Terraform Apply
        run: terraform apply -auto-approve -no-color

