name: Landing Zone Deployment

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform-security-scan:
    runs-on: self-hosted

    steps:

      # ==================================================
      # 1. Checkout
      # ==================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==================================================
      # 2. Configure Python PATH
      # ==================================================
      - name: Configure Python PATH
        shell: powershell
        run: |
          $pythonPath = "C:\Users\ylaxa\AppData\Local\Programs\Python\Python313"
          $pythonScripts = "C:\Users\ylaxa\AppData\Local\Programs\Python\Python313\Scripts"

          if (Test-Path $pythonPath) {
            $env:PATH = "$pythonPath;$env:PATH"
          }

          if (Test-Path $pythonScripts) {
            $env:PATH = "$pythonScripts;$env:PATH"
          }

          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8


      # ==================================================
      # 3. Verify Tools
      # ==================================================
      - name: Verify Security Tools
        shell: powershell
        continue-on-error: true
        run: |
          Write-Host "========== Trivy =========="
          trivy --version

          Write-Host "========== Checkov =========="
          python --version
          checkov --version

          Write-Host "========== TFLint =========="
          tflint --version


      # ==================================================
      # 4. Trivy Scan
      # Security issues will NOT stop pipeline
      # ==================================================
      - name: Trivy Terraform Security Scan
        shell: powershell
        continue-on-error: true
        run: |
          trivy config . `
            --severity HIGH,CRITICAL `
            --exit-code 1


      # ==================================================
      # 5. Checkov Scan
      # Security issues will NOT stop pipeline
      # ==================================================
      - name: Checkov Terraform Security Scan
        shell: powershell
        continue-on-error: true
        run: |
          checkov -d . `
            --framework terraform `
            --quiet


      # ==================================================
      # 6. TFLint
      # Lint errors will NOT stop pipeline
      # ==================================================
      - name: TFLint
        shell: powershell
        continue-on-error: true
        run: |
          tflint --recursive


      # ==================================================
      # 7. Azure Login
      # ==================================================
      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ==================================================
      # 8. Verify Azure Login
      # ==================================================
      - name: Verify Azure Login
        shell: powershell
        run: |
          az account show


      # ==================================================
      # 9. Terraform Init
      # ==================================================
      - name: Terraform Init
        shell: powershell
        working-directory: .\ENV(parent_module)\DEV
        run: |
          terraform init -no-color


      # ==================================================
      # 10. Terraform Validate
      # ==================================================
      - name: Terraform Validate
        shell: powershell
        working-directory: .\ENV(parent_module)\DEV
        run: |
          terraform validate -no-color


      # ==================================================
      # 11. Terraform Plan
      # ==================================================
      - name: Terraform Plan
        shell: powershell
        working-directory: .\ENV(parent_module)\DEV
        run: |
          terraform plan -no-color


      # ==================================================
      # 12. Terraform Apply
      # ==================================================
      - name: Terraform Apply
        shell: powershell
        working-directory: .\ENV(parent_module)\DEV
        run: |
          terraform apply -auto-approve -no-color
