# File: .github/workflows/workflow.yml

name: Run Azure Login
on: workflow_dispatch

permissions:
  id-token: write
  contents: read
jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Azure login
        uses: azure/login@v3
        with:
          secret-id: ${{ secrets.IfP8Q~ZGP0Hjrxm0W2FPUJbNqqIIdt.qGd_sOcvc }}
          client-id: ${{ secrets.0c075194-1758-4a04-b64f-65876a4bedfd }}
          tenant-id: ${{ secrets.b6f32ed5-51d1-4226-96a6-db5b972504ce }}
          subscription-id: ${{ 2cec8319-0121-4912-85d6-b2e4e5d68fbf }}

      - name: Azure CLI script
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az account show
